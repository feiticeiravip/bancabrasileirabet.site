<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Banca Brasileira</title>

<meta name="description" content="Banca Brasileira plataforma moderna online com experiência rápida, segura e otimizada para dispositivos móveis.">

<meta name="keywords" content="banca brasileira online, plataforma banca brasileira, banca brasileira oficial">

<meta name="robots" content="index,follow">

<meta property="og:title" content="Banca Brasileira">

<meta property="og:description" content="Plataforma moderna Banca Brasileira">

<meta property="og:type" content="website">

<meta name="theme-color" content="#ffffff">

<link rel="canonical" href="https://bancabrasileirabet.site">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

html,
body{

height:100%;
width:100%;

font-family:

system-ui,
Arial;

overflow:hidden;

background:

#f5f5f5;

}

.header{

position:fixed;

top:0;

left:0;

width:100%;

height:48px;

background:

rgba(255,255,255,.96);

backdrop-filter:

blur(12px);

display:flex;

align-items:center;

justify-content:center;

font-size:

20px;

font-weight:

700;

box-shadow:

0 1px 8px rgba(0,0,0,.08);

z-index:

999;

}

.frame-wrap{

position:fixed;

top:48px;

left:0;

width:100%;

height:

calc(100vh - 48px);

}

iframe{

width:100%;

height:100%;

border:none;

display:block;

background:white;

}

.menu-btn{

position:fixed;

right:18px;

top:70px;

width:55px;

height:55px;

border:none;

border-radius:18px;

font-size:24px;

cursor:pointer;

background:

#111;

color:white;

z-index:1002;

box-shadow:

0 5px 20px rgba(0,0,0,.2);

}

.partner-menu{

position:fixed;

right:-300px;

top:135px;

width:240px;

background:white;

border-radius:18px;

padding:15px;

display:flex;

flex-direction:column;

gap:10px;

transition:.3s;

box-shadow:

0 10px 40px rgba(0,0,0,.15);

z-index:1001;

}

.partner-menu.open{

right:15px;

}

.partner-menu a{

text-decoration:none;

padding:14px;

border-radius:12px;

background:#f1f1f1;

color:#111;

font-weight:600;

}

</style>

</head>

<body>

<div class="header">

Banca Brasileira

</div>


<div class="frame-wrap">

<iframe

src="https://app.bancabrasileira.com.br/pr/UBmDxM8X"

loading="eager"

allowfullscreen

referrerpolicy="strict-origin-when-cross-origin"

allow="

clipboard-read;

clipboard-write;

autoplay;

fullscreen;

payment;

camera;

microphone;

geolocation;

web-share;

accelerometer;

gyroscope

">

</iframe>

</div>


<button

class="menu-btn"

onclick="toggleMenu()">

☰

</button>


<div

class="partner-menu"

id="partnerMenu">

<a href="https://superbancas.app">

SuperBancas

</a>

<a href="https://bancabrasileira.net.br">

Banca Brasileira

</a>

<a href="https://tigerclub.net.br">

Tiger Club

</a>

<a href="https://sorteclub.site">

Sorte Club

</a>

</div>


<script>

function toggleMenu(){

document

.getElementById(
"partnerMenu"
)

.classList

.toggle(
"open"
);

}

</script>

</body>

</html>
